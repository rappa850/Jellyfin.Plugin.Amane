<div id="AmaneConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-linkbutton">
    <div data-role="content">
        <div class="content-primary">
            <form id="AmaneConfigForm">
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ServerUrl">Amane 服务地址</label>
                    <input is="emby-input" type="url" id="ServerUrl" />
                    <div class="fieldDescription">例如 http://127.0.0.1:18000</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ApiToken">API Token</label>
                    <input is="emby-input" type="password" id="ApiToken" />
                    <div class="fieldDescription">Amane 的 API 访问令牌（Authorization: Bearer）</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="TimeoutSeconds">请求超时（秒）</label>
                    <input is="emby-input" type="number" id="TimeoutSeconds" min="1" max="120" />
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>保存</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            const pluginId = '9f2e4a6b-7c1d-4e3f-8a5b-0d9c2e1f4a7b';
            const page = document.querySelector('#AmaneConfigPage');

            page.addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    page.querySelector('#ServerUrl').value = config.ServerUrl || 'http://127.0.0.1:18000';
                    page.querySelector('#ApiToken').value = config.ApiToken || '';
                    page.querySelector('#TimeoutSeconds').value = config.TimeoutSeconds || 10;
                    Dashboard.hideLoadingMsg();
                });
            });

            page.querySelector('#AmaneConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.ServerUrl = page.querySelector('#ServerUrl').value.trim();
                    config.ApiToken = page.querySelector('#ApiToken').value.trim();
                    config.TimeoutSeconds = parseInt(page.querySelector('#TimeoutSeconds').value, 10) || 10;
                    ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
            });
        })();
    </script>
</div>
