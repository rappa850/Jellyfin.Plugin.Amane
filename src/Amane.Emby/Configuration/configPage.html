<div id="AmaneConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-linkbutton" data-controller="__plugin/amaneConfig">
    <div data-role="content">
        <div class="content-primary">
            <form id="AmaneConfigForm">
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ServerUrl">Amane 服务地址</label>
                    <input is="emby-input" type="url" id="ServerUrl" />
                    <div class="fieldDescription">例如 http://127.0.0.1:18000</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ApiToken">API Token</label>
                    <input is="emby-input" type="password" id="ApiToken" />
                    <div class="fieldDescription">Amane 的 API 访问令牌（Authorization: Bearer）</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="TimeoutSeconds">请求超时（秒）</label>
                    <input is="emby-input" type="number" id="TimeoutSeconds" min="1" max="120" />
                    <div class="fieldDescription">单请求超时，冷门资源刮削慢时可调大（默认 5）</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="MaxConcurrentRequests">最大并发请求数</label>
                    <input is="emby-input" type="number" id="MaxConcurrentRequests" min="1" max="32" />
                    <div class="fieldDescription">批量刮削时同时发往 Amane 的查询上限（默认 4，重启后生效）</div>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ActorCacheMinutes">演员缓存时长（分钟）</label>
                    <input is="emby-input" type="number" id="ActorCacheMinutes" min="0" max="10080" />
                    <div class="fieldDescription">演员信息进程内缓存时长（默认 360，即 6 小时）；填 0 禁用缓存，Amane 侧更新后立即可见</div>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>保存</span>
                    </button>
                </div>
                <div style="margin-top: 1.5em;">
                    <button is="emby-button" type="button" id="TestConnection" class="raised block emby-button">
                        <span>测试连接</span>
                    </button>
                    <div class="fieldDescription">按已保存的配置探活 Amane 并验证 Token，改动后请先保存再测试</div>
                    <div id="TestConnectionResult" style="margin-top: 0.5em; display: none;"></div>
                </div>
                <div style="margin-top: 1.5em;">
                    <button is="emby-button" type="button" id="ClearCache" class="raised block emby-button">
                        <span>清除演员缓存</span>
                    </button>
                    <div class="fieldDescription">Amane 侧演员数据更新后，清除缓存让下次刮削立即拉取最新数据（影片元数据插件侧不缓存）</div>
                    <div id="ClearCacheResult" style="margin-top: 0.5em; display: none;"></div>
                </div>
            </form>
        </div>
    </div>
</div>
